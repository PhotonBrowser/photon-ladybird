[package]
name = "photon-cli"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[workspace]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
ctrlc = "3.4"
indicatif = "0.18"
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
