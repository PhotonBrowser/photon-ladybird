<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Photon Chrome</title>
  <style>/* PHOTON_STYLES */</style>
</head>
<body>
  <header class="toolbar" data-photon-input="capture">
    <button id="back" aria-label="Back">←</button>
    <button id="forward" aria-label="Forward">→</button>
    <button id="reload" aria-label="Reload">↻</button>
    <form id="address-form"><input id="address" aria-label="Address" autocomplete="off"></form>
    <button id="overlay" aria-label="Open overlay">Overlay test</button>
    <span id="status" aria-live="polite"></span>
  </header>
  <section id="popover" class="popover" aria-hidden="true" data-photon-input="capture">
    <strong>Photon popover</strong>
    <p>This is a separate privileged document above the webpage.</p>
    <button id="close-popover">Close</button>
  </section>
  <script>/* PHOTON_SCRIPT */</script>
</body>
</html>
